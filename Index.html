  <title>JB TIME — Control de Tiempos</title>
  <script>
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("jb_time_theme") || t;
        if (t !== "light" && t !== "dark") t = "dark";
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.colorScheme = t;
    })();
  </script>
