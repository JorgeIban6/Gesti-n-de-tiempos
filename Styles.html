<style>
:root, html[data-theme="dark"] {

  --bg-elev: #0d1628;
  --bg-card: #121c30;
  --bg-input: #152238;

  --bg-status: #132038;
  --bg-kpi: #152a48;

  --line-strong: #4d8cff;
  --text: #eef3ff;
  --muted: #a9b8d4;
  --muted-2: #c5d0e8;
  --heading: #ffffff;
  --blue: #2f6bff;
  --blue-bright: #4d8cff;
  --green: #2dd4a0;
  --amber: #f5b942;
  --red: #ff6b7a;
  --red-soft: #ff8a96;
  --tick: #243656;
  --btn-sec-bg: #1e3a5f;
  --btn-sec-text: #eef3ff;
  --chart-grid: rgba(255, 255, 255, 0.06);
  --danger-bg: #7f1d1d;
  --danger-text: #fecaca;
  --ok-bg: #14532d;
  --ok-text: #86efac;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f6fb;
  --bg-elev: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --bg-topbar: #ffffff;
  --bg-status: #e8eef8;
  --bg-kpi: #ffffff;
  --line: #c9d6ea;
  --line-strong: #8eb0f0;
  --text: #152033;
  --muted: #5c6d86;
  --muted-2: #4a5c76;
  --heading: #0f1b2d;
  --blue: #2f6bff;
  --blue-bright: #2563eb;
  --green: #0d9b72;
  --amber: #b8840d;
  --red: #d64555;
  --red-soft: #c43446;
  --tick: #c5d3ea;
  --btn-sec-bg: #e8eef8;
  --btn-sec-text: #1a2b48;
  --chart-grid: rgba(21, 32, 51, 0.08);
  --danger-bg: #b91c1c;
  --danger-text: #ffffff;
  --ok-bg: #dcfce7;
  --ok-text: #166534;
}
html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.45;
}
.bg-glow, .bg-grid { display: none; }
.topbar, .layout, .footer { position: relative; z-index: 1; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.4rem;
  border-bottom: 1px solid var(--line);
  background: var(--bg-topbar);
}
.brand { display: flex; align-items: center; gap: 0.9rem; }
.brand-logo-wrap { position: relative; display: inline-flex; align-items: center; }
.brand-logo {
  height: 44px;
  width: auto;
  background: #ffffff;
  border-radius: 10px;
  padding: 4px 8px;
}
.stay-awake-hotspot {
  position: absolute;
  left: 32%;
  top: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}
.stay-awake-hotspot.is-on {
  background: rgba(47, 107, 255, 0.14);
  box-shadow: 0 0 10px 2px rgba(47, 107, 255, 0.4);
}
.brand-meta { display: flex; flex-direction: column; }
.brand-tag { font-weight: 700; color: var(--heading); font-size: 15px; }
.brand-clock { font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
.field-inline { display: flex; align-items: center; gap: 0.45rem; font-size: 14px; color: var(--muted-2); }
.field-inline select, .form select, .form input, .form textarea {
  background: var(--bg-input);
  color: var(--text);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
}
.btn {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: 700;
  cursor: pointer;
  color: #fff;
  background: var(--blue);
}
.btn-primary.is-loading { opacity: 0.7; }
.btn-secondary {
  background: var(--btn-sec-bg);
  color: var(--btn-sec-text);
  border: 1px solid var(--line-strong);
}
.btn-theme {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: var(--bg-elev);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.btn-theme svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.btn-theme .icon-moon { display: none; }
html[data-theme="light"] .btn-theme .icon-sun { display: none; }
html[data-theme="light"] .btn-theme .icon-moon { display: block; }
.cronometro {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  width: auto;
  min-width: 210px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-elev);
}
.cronometro.is-hidden { display: none !important; }
.crono-dial { position: relative; width: 92px; height: 92px; flex: 0 0 92px; }
.crono-dial svg { width: 100%; height: 100%; }
.crono-tick { fill: var(--tick); }
.crono-tick.is-on { fill: var(--blue-bright); }
.cronometro.is-running .crono-tick.is-on { fill: var(--green); }
.crono-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.crono-center strong { font-size: 22px; line-height: 1; color: var(--heading); }
.crono-center span { font-size: 10px; color: var(--muted); }
.crono-actions { display: flex; flex-direction: column; gap: 4px; width: 92px; flex: 0 0 92px; }
.crono-actions .btn { width: 100%; padding: 6px 8px; font-size: 12px; }
.layout {
  width: 96%;
  max-width: 1180px;
  margin: 16px auto 40px;
}
.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 12px;
  background: var(--bg-status);
  border: 1px solid var(--line);
  color: var(--text);
  margin-bottom: 14px;
  font-size: 14px;
}
.status-dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--amber);
}
.status-dot.ok { background: var(--green); }
.status-dot.err { background: var(--red); }
.muted { color: var(--muted); font-size: 13px; }
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.kpi {
  background: var(--bg-kpi);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 12px 14px;
  min-height: 72px;
}
.kpi-label { display: block; color: var(--muted-2); font-size: 12px; margin-bottom: 6px; }
.kpi-value { font-size: 26px; font-weight: 700; color: var(--heading); }
.kpi-value small { font-size: 12px; color: var(--muted); margin-left: 4px; }
.kpi--neto .kpi-value { color: var(--green); }
.kpi--deficit .kpi-value { color: var(--red-soft); }
.kpi--excedente .kpi-value { color: var(--amber); }
.kpi--ocio .kpi-value { color: var(--blue-bright); }
.panel-grid, .panel-grid--3 {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
}
.panel-head h2 { margin: 0; color: var(--heading); font-size: 17px; }
.panel-head p { margin: 4px 0 10px; color: var(--muted-2); font-size: 13px; }
.chart-wrap { width: 100%; min-height: 180px; background: var(--bg-elev); border-radius: 10px; }
.stat-list { list-style: none; margin: 0; padding: 0; }
.stat-list li {
  display: flex;
  justify-content: space-between;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 10px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--text);
}
.table-scroll { overflow: auto; max-height: 280px; }
.data-table { width: 100%; border-collapse: collapse; color: var(--text); font-size: 13px; }
.data-table th, .data-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.data-table th { color: var(--muted-2); }
.badge { padding: 2px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge-ticket { background: #1e3a8a; color: #bfdbfe; }
.badge-ocio { background: #78350f; color: #fde68a; }
html[data-theme="light"] .badge-ticket { background: #dbeafe; color: #1e3a8a; }
html[data-theme="light"] .badge-ocio { background: #fef3c7; color: #92400e; }
.form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
}
.form > *:not(#fieldsTicketObs):not(#cronometroBox) { grid-column: 1 / -1; }
#fieldsTicketObs { grid-column: 1; min-width: 0; }
#cronometroBox { grid-column: 2; align-self: start; }
.form-row { display: flex; flex-wrap: wrap; gap: 10px; }
.is-hidden, .form-row.is-hidden { display: none !important; }
.form label { display: grid; gap: 4px; color: var(--muted-2); font-size: 13px; flex: 1 1 140px; }
.form-msg.ok { color: var(--green); }
.form-msg.err { color: var(--red-soft); }
.form-panel { margin-bottom: 14px; }
.panel--wide { min-width: 0; }
.grow { flex: 2 1 220px; }
.form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.forms-help { margin: 0 0 6px; }
.btn-icon { margin-right: 4px; }
.chart-wrap--sm { min-height: 180px; }
.btn.is-loading { opacity: 0.7; pointer-events: none; }
canvas { max-width: 100%; }
.badge-abierto { background: var(--ok-bg); color: var(--ok-text); }
.badge-cerrado { background: var(--danger-bg); color: var(--danger-text); }
.stat-deficit { color: var(--red-soft); }
.stat-excedente { color: var(--amber); }
.caso-card {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-elev);
}
.caso-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.caso-head h3 { margin: 0; color: var(--heading); font-size: 16px; }
.footer {
  width: 96%;
  max-width: 1180px;
  margin: 0 auto 24px;
  color: var(--muted);
  font-size: 13px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.admin-form {
  display: grid;
  grid-template-columns: 1fr !important;
  gap: 10px;
}
.admin-form > * { grid-column: 1 / -1 !important; }
.admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 12px;
}
.admin-tab {
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--muted-2);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.admin-tab.is-on {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue-bright);
}
.admin-scroll { max-height: 380px; margin-top: 10px; }
.btn-tiny { padding: 4px 8px; font-size: 12px; }
.btn-danger { background: var(--danger-bg); color: var(--danger-text); }
.check {
  display: flex !important;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  flex: 0 1 auto;
}
.check input { width: auto; }
@media (max-width: 980px) {
  .kpi-grid, .panel-grid, .panel-grid--3 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .form { grid-template-columns: 1fr; }
  #fieldsTicketObs, #cronometroBox { grid-column: 1; }
  .form-actions { order: 10; }
  #cronometroBox { order: 12; width: 100%; max-width: 260px; justify-self: center; }
}
</style>
